schema_version: 1
title: NLM dataset catalog
description: >-
  Canonical descriptions and artifact locations for processed datasets in the
  NLM workspace. Add new maintained datasets here; the dashboard and generated
  docs/datasets.md read from this catalog.
notes:
  - >-
    The V0 baseline has 2,699 rows; its historical frozen split is 2,159 train
    and 540 validation rows. External-only training can use full V0 validation
    where the training workflow is configured to do so.
  - >-
    Open Pool-derived datasets in this catalog use the locally downloaded Open
    Pool V11 source unless a description names a later release. Some older
    artifact profiles use the `openpool_v11_*` curation naming.
  - >-
    `data/processed/test_v0.parquet` is a small test fixture, not a maintained
    dataset or the Kaggle test set, and is intentionally not cataloged.
  - >-
    There is no V1.6 dataset artifact or build recipe registered at this time.
resources:
  - label: Data factories
    path: configs/data/
    description: Dataset factory configuration files.
  - label: V1 curation audit
    path: data/processed/openpool_v1_removals.csv
    description: Row-level V1 quality exclusions and quota sampling decisions.
  - label: V1.1 curation audit
    path: data/processed/openpool_v1.1_removals.csv
    description: Row-level V1.1 quality exclusions and selection decisions.
  - label: V2 Open Pool curation audit
    path: data/processed/openpool_v2_openpool_removals.csv
    description: Row-level hard-quality exclusions for the V2 Open Pool staging dataset.
datasets:
  - id: v0
    name: V0 — Kaggle baseline
    section: Baseline and historical split
    description: Original labeled Name That LLM Kaggle training data with 18 model classes.
    artifact: data/processed/dataset_v0.parquet
    profile: data/processed/dataset_profile.json
    validation: "Historical frozen prompt-group split: 2,159 train and 540 validation rows."

  - id: v1
    name: V1 — Balanced Open Pool
    section: Training datasets
    description: Quality-filtered Open Pool responses, reduced to 2,711 items per class with a fixed-seed source-proportional sample. Quota-excluded rows are not necessarily low quality.
    artifact: data/processed/dataset_v1.parquet
    profile: data/processed/dataset_profile_v1.json
    validation: External training rows; use the V0 validation dataset in training experiments.

  - id: v1.1
    name: V1.1 — Error-focused Open Pool
    section: Training datasets
    description: V1 plus shorter quality-filtered Open Pool responses for `claude-fable-5`, `glm-5.3`, and `glm-5.3-flash`.
    artifact: data/processed/dataset_v1.1.parquet
    profile: data/processed/dataset_profile_v1.1.json
    validation: External training rows; use the V0 validation dataset in training experiments.

  - id: v1.2_bm
    name: V1.2-BM — B2M responses absent from V1.1
    section: Training datasets
    description: B2M response texts not present in V1.1, retaining source, prompt, route, and provider provenance. No additional quality filtering or balancing was applied.
    artifact: data/processed/dataset_v1.2_bm.parquet
    profile: data/processed/dataset_profile_v1.2_bm.json
    validation: External training rows; use the V0 validation dataset in training experiments.

  - id: v1_all
    name: V1-all — V1.1 plus V1.2-BM
    section: Training datasets
    description: Union of V1.1 and V1.2-BM after exact response deduplication; natural class counts are retained without additional balancing.
    artifact: data/processed/dataset_v1_all.parquet
    profile: data/processed/dataset_profile_v1_all.json
    validation: External training rows; use the V0 validation dataset in training experiments.

  - id: v1.5
    name: V1.5 — V0 plus V1
    section: Training datasets
    description: Combines V1 Open Pool rows with the V0 training partition.
    artifact: data/processed/dataset_v1.5.parquet
    profile: data/processed/dataset_profile_v1.5.json
    validation: 50,957 train and the unchanged 540 V0 validation rows, with explicit split assignments.

  - id: v1.3
    name: V1.3 — External GLM and GPT sources
    section: Training datasets
    description: Normalized collection from external GLM-5.3-Flash and GPT-5.6 Sol/Luna corpora, before defect cleaning.
    artifact: data/processed/dataset_v1.3.parquet
    profile: data/processed/dataset_profile_v1.3.json
    validation: External training rows; only three of the 18 model labels are represented.
    reports:
      - docs/v1.3.md

  - id: v1.3_clean
    name: V1.3 Clean
    section: Training datasets
    description: V1.3 after explicit defect cleaning.
    artifact: data/processed/dataset_v1.3_clean.parquet
    profile: data/processed/dataset_profile_v1.3_clean.json
    validation: External training rows; only three of the 18 model labels are represented.

  - id: v1.3_compact
    name: V1.3 Compact
    section: Training datasets
    description: V1.3 Clean with verified same-label near-duplicate rows removed.
    artifact: data/processed/dataset_v1.3_compact.parquet
    profile: data/processed/dataset_profile_v1.3_compact.json
    validation: External training rows; only three of the 18 model labels are represented.

  - id: v1-all_clean
    name: V1-all Clean
    section: Training datasets
    description: V1-all screened for demonstrable defects. The audit found no defect rows, so all source rows remain.
    artifact: data/processed/dataset_v1-all_clean.parquet
    profile: data/processed/dataset_profile_v1-all_clean.json
    validation: External training rows; use the V0 validation dataset in training experiments.
    reports:
      - docs/v1_all_clean_compact.md

  - id: v1-all_compact
    name: V1-all Compact
    section: Training datasets
    description: V1-all Clean screened for measured redundancy. No qualifying near-duplicate rows were found, so all source rows remain.
    artifact: data/processed/dataset_v1-all_compact.parquet
    profile: data/processed/dataset_profile_v1-all_compact.json
    validation: External training rows; use the V0 validation dataset in training experiments.
    reports:
      - docs/v1_all_clean_compact.md

  - id: v1-all_balanced_deduped
    name: V1-all Balanced and Deduped
    section: Training datasets
    description: V1-all curated with verified near-duplicate detection and adaptive source/prompt diversity selection; it does not enforce equal class quotas.
    artifact: data/processed/dataset_v1-all_balanced_deduped.parquet
    profile: data/processed/dataset_profile_v1-all_balanced_deduped.json
    validation: External training rows; use the V0 validation dataset in training experiments.
    reports:
      - docs/v1_all_balanced_deduped.md

  - id: v2_openpool
    name: V2 Open Pool — eligible source rows
    section: Staging datasets
    description: English Open Pool responses retained by the hard quality filters, before assembling the V2 mix.
    artifact: data/processed/dataset_v2_openpool.parquet
    profile: data/processed/dataset_profile_v2_openpool.json
    validation: Staging training source; no V0 rows are included.

  - id: v2.0
    name: V2.0 — Balanced external corpus
    section: Training datasets
    description: Balanced external-only corpus assembled from Open Pool, B2M, and available V1.3 sources; sampling targets 3,000 examples per class, reduced to 2,867 by the limiting class.
    artifact: data/processed/dataset_v2.0.parquet
    profile: data/processed/dataset_profile_v2.0.json
    validation: External training rows; use the V0 validation dataset in training experiments.
    reports:
      - docs/v2.0.md

  - id: v2.0.chunks800
    name: V2.0 chunks800 — One full response plus chunk views
    section: Training datasets
    description: V2.0 with up to three deterministic, word-boundary-aware 800-character chunk views per original response; training samples one complete or chunk view per original each epoch.
    artifact: data/processed/dataset_v2.0.chunks800.parquet
    profile: data/processed/dataset_profile_v2.0.chunks800.json
    validation: Training uses one view per original response per epoch; validation and checkpoint selection use complete responses from V0.
    reports:
      - docs/v2.0.chunks800.md

  - id: v2.0.chunks.300TokBalanced
    name: V2.0 token chunks — 300 tokens
    section: Training datasets
    description: Every V2.0 response is split into deterministic overlapping 300-token maximum windows (150-token stride); every chunk is an independent, equally weighted training row with no additional balancing.
    artifact: data/processed/dataset_v2.0.chunks.300TokBalanced.parquet
    profile: data/processed/dataset_profile_v2.0.chunks.300TokBalanced.json
    validation: External training chunks; validate and select checkpoints on complete unchunked V0 responses.
    max_encoded_length: 300
    reports:
      - docs/v2.0.chunks.300TokBalanced.md

  - id: v2.0.chunks.200TokBalanced
    name: V2.0 token chunks — 200 tokens
    section: Training datasets
    description: Every V2.0 response is split into deterministic overlapping 200-token maximum windows (100-token stride); every chunk is an independent, equally weighted training row with no additional balancing.
    artifact: data/processed/dataset_v2.0.chunks.200TokBalanced.parquet
    profile: data/processed/dataset_profile_v2.0.chunks.200TokBalanced.json
    validation: External training chunks; validate and select checkpoints on complete unchunked V0 responses.
    max_encoded_length: 200
    reports:
      - docs/v2.0.chunks.200TokBalanced.md

  - id: v2_0_c800_t300_t200
    name: V2.0 combined c800 + t300 + t200 views
    section: Training datasets
    description: Concatenates all rows from the V2.0 800-character multi-view dataset and the 300-token and 200-token chunk datasets; each combined row is an independent, equally weighted training example.
    artifact: data/processed/dataset_v2_0_c800_t300_t200.parquet
    profile: data/processed/dataset_profile_v2_0_c800_t300_t200.json
    validation: Training-only rows derived from V2.0; validate and select checkpoints on complete unchunked V0 responses.
    reports:
      - docs/v2_0_c800_t300_t200.md

  - id: v2.1
    name: V2.1 — Balanced external corpus with unverified Gemini 3.7 source
    section: Training datasets
    description: 3,000 examples per class from Open Pool, B2M, V1.3, and unflagged rows in the unverified Gemini 3.7 sidecar; unverified attribution is retained as a caveat.
    artifact: data/processed/dataset_v2.1.parquet
    profile: data/processed/dataset_profile_v2.1.json
    validation: External training rows; use the V0 validation dataset in training experiments.
    reports:
      - docs/v2.1.md

  - id: v2.14
    name: V2.14 — Open Pool V14 plus B2M additions
    section: Training datasets
    description: All 223,840 V14 main-file rows plus 7,496 B2M response texts absent from V14 after NFKC, case-fold, and whitespace normalization. No quality filtering or balancing was added; 891 added B2M Gemini 3.7 rows retain their quarantine flag. The V14 unverified sidecar is excluded.
    artifact: data/processed/dataset_v2.14.parquet
    profile: data/processed/dataset_profile_v2.14.json
    validation: External training rows; all 2,699 V0 rows are used for validation by the full-V0 training workflow.
    reports:
      - docs/v2.14.md
      - docs/openpool_v14_comparison.md

  - id: v2.14CW
    name: V2.14CW — Class-weighted SFT recipe
    section: Training datasets
    description: "Uses the exact V2.14 rows and metadata with weighted cross-entropy during training with weights of 2.0 for claude-fable-5, glm-5.3 and gemini-3.7-flash; 1.0 for the other labels. Validation loss and metrics remain unweighted."
    artifact: data/processed/dataset_v2.14.parquet
    profile: data/processed/dataset_profile_v2.14.json
    class_weights:
      claude-fable-5: 2.0
      glm-5.3: 2.0
      gemini-3.7-flash: 2.0
    validation: External training rows; all 2,699 V0 rows are used for validation by the full-V0 training workflow.
    reports:
      - docs/v2.14CW.md
      - docs/v2.14.md

  - id: v2.14HN
    name: V2.14HN — OOS hard-negative weighted dataset
    section: Training datasets
    description: All V2.14 rows retained with per-row hardness metadata and per-label-normalized sampling weights; OOS difficulty scores come from V1.1 SVC and CatBoost only for response texts absent from their training corpus. V1.1-overlapping rows remain unscored, and V0 is not used for mining.
    artifact: data/processed/dataset_v2.14HN.parquet
    profile: data/processed/dataset_profile_v2.14HN.json
    validation: External-only training data; use all 2,699 official V0 rows only for validation and checkpoint selection.
    reports:
      - docs/v2.14HN.md

  - id: v2.14HN-resampled
    name: V2.14HN Resampled — weighted physical rows
    section: Training datasets
    description: Deterministic per-label replacement resampling from V2.14HN, with rows sampled in proportion to hardness weights and each class retained at its original V2.14 count.
    artifact: data/processed/dataset_v2.14HN-resampled.parquet
    profile: data/processed/dataset_profile_v2.14HN-resampled.json
    validation: Training-only weighted-resampling export; use all 2,699 official V0 rows for validation.
    reports:
      - docs/v2.14HN.md

  - id: v2.14.balanced
    name: V2.14 Balanced — quality-filtered V2.14
    section: Training datasets
    description: V2.14 filtered by response length, V0 overlap, normalized duplicates/conflicts, language, routing, truncation, multi-turn, serialized output, code, and explicit reasoning traces; balanced at the smallest eligible class count of 3,539.
    artifact: data/processed/dataset_v2.14.balanced.parquet
    profile: data/processed/dataset_profile_v2.14.balanced.json
    validation: External training rows; all 2,699 V0 rows are used for validation by the full-V0 training workflow.
    reports:
      - docs/v2.14.balanced.md

  - id: v2.14-prediction-filtered
    name: V2.14 prediction-filtered
    section: Training datasets
    description: V2.14 rows selected by deterministic UltraBERT, SVC, and CatBoost prediction categories to retain more difficult examples.
    artifact: data/processed/dataset_v2.14-prediction-filtered.parquet
    profile: data/processed/dataset_profile_v2.14-prediction-filtered.json
    validation: External training rows only; use the complete V0 validation dataset in the standard training workflow.
    reports:
      - docs/v2.14_prediction_filter_report.md

  - id: v2.14-prediction-filtered-80pct
    name: V2.14 prediction-filtered 80%
    section: Training datasets
    description: V2.14 prediction-guided reduction retaining 60% of very-easy examples and all examples in the other five categories; deterministic, external-only, with natural label frequencies.
    artifact: data/processed/dataset_v2.14-prediction-filtered-80pct.parquet
    profile: data/processed/dataset_profile_v2.14-prediction-filtered-80pct.json
    validation: External-only training data; use all 2,699 official V0 rows for validation and checkpoint selection. No V0 rows are included in training.
    reports:
      - docs/v2.14_prediction_filter_80pct_report.md

  - id: v2.15_extrato_14
    name: V2.15_extrato_14 — New external responses absent from V2.14
    section: Training datasets
    description: Incremental, natural-frequency external corpus from five requested Kaggle sources, deduplicated against full V2.14, isolated from known V0 response and prompt groups, and filtered to responses of at most 2,000 characters.
    artifact: data/processed/dataset_v2.15_extrato_14.parquet
    profile: data/processed/dataset_profile_v2.15_extrato_14.json
    validation: External-only training data; use all 2,699 official V0 rows for validation. Known prompt-ID overlaps are excluded; official V0 contains no canonical prompt text for exact prompt-text comparison.
    reports:
      - docs/v2.15_extrato_14.md
      - docs/v2.15_extrato_14_length_filter.md

  - id: v2.16_14plus15
    name: V2.16_14plus15 — V2.14 plus V2.15_extrato_14
    section: Training datasets
    description: Complete V2.14 dataset combined with all 46,347 V2.15_extrato_14 additions; no extra filtering, balancing, or sampling.
    artifact: data/processed/dataset_v2.16_14plus15.parquet
    profile: data/processed/dataset_profile_v2.16_14plus15.json
    validation: External-only training rows; validate and select checkpoints on all 2,699 V0 rows.
    reports:
      - docs/v2.16_14plus15.md

  - id: v2.16
    name: V2.16 — V2.14 plus V2.15_extrato_14
    section: Training datasets
    description: Alias for v2.16_14plus15, preserving the same 277,683-row external-only artifact and provenance.
    artifact: data/processed/dataset_v2.16.parquet
    profile: data/processed/dataset_profile_v2.16.json
    validation: External-only training rows; validate and select checkpoints on all 2,699 V0 rows.
    reports:
      - docs/v2.16_14plus15.md

  - id: v2.16_openpool16_increment
    name: V2.16 Open Pool 16 increment
    section: Training datasets
    description: New Open Pool v16 examples absent from V2.16, quality-filtered and retained as an incremental artifact with source provenance.
    artifact: data/processed/dataset_v2.16_openpool16_increment.parquet
    profile: data/processed/dataset_profile_v2.16_openpool16_increment.json
    validation: Incremental external training rows; this artifact has incomplete label coverage and is intended for combination with a full-label dataset.
    reports:
      - docs/openpool_v16_increment.md

  - id: v2_16OP_RandomGroups
    name: v2,16OP-RandomGroups — External source-prompt groups
    section: Research datasets
    description: Deterministic, source-prompt-preserving random subsets of the V2.16 Open Pool increment, with 4–10 groups per achievable size and one response per distinct label. Sizes 13–18 are unavailable in the source.
    artifact: data/processed/dataset_v2_16OP_RandomGroups.parquet
    profile: data/processed/dataset_profile_v2_16OP_RandomGroups.json
    validation: External-only E26 meta-training data; split and tune by original source prompt. V0 is reserved for robustness evaluation and must not be used for fitting.
    reports:
      - docs/e26.md

  - id: v2.GR.OR16
    name: V2.GR.OR16 — Group-Ranking Open Pool v16
    section: Training datasets
    description: All 231,036 labeled rows from the original Open Pool v16 main parquet, with namespaced prompt IDs and deterministic duplicate-label rotation metadata for group-ranking training.
    artifact: data/processed/dataset_v2.GR.OR16.parquet
    profile: data/processed/dataset_profile_v2.GR.OR16.json
    validation: External-only training data; reserve all 2,699 official V0 rows for validation and checkpoint selection.
    external_only: true
    validation_dataset: v0
    validation_rows: 2699
    reports:
      - docs/v2.GR.OR16.md

  - id: v3.0
    name: V3.0 — Open Pool v16 excluding V0-EXT prompt groups
    section: Training datasets
    description: Open Pool v16 main parquet after removing all known V0-overlapping responses, the frozen 4,000-row V0-EXT set, and every response sharing a V0-EXT prompt group; original row schema and source metadata are preserved.
    artifact: data/processed/dataset_v3.0.parquet
    profile: data/processed/dataset_profile_v3.0.json
    validation: External-only training dataset; evaluate on the complete V0 and frozen V0-EXT validation datasets in separate evaluation runs.
    external_only: true
    validation_datasets:
      - v0
      - v0_ext
    reports:
      - docs/v3.0.md

  - id: granite4_350m_v214_openpool16_v0w10
    name: Granite 4 350M V2.14 + Open Pool v16 + V0 weighted mix
    section: Training datasets
    description: V2.14 and Open Pool v16 increment at per-row sampling weight 1, plus all V0 responses at weight 10. Normalized-text collisions retain V0. Training has V0 exposure and must not be used for external-only Trust List validation.
    artifact: data/processed/dataset_granite4_350m_v214_openpool16_v0w10.parquet
    profile: data/processed/dataset_profile_granite4_350m_v214_openpool16_v0w10.json
    validation: Disabled; all rows, including V0, are sampled for training. Checkpoints are marked V0-exposed.

  - id: v2.14_plus_v2.15_extrato_14
    name: V2.14 + V2.15_extrato_14 — Combined external training corpus
    section: Training datasets
    description: Complete V2.14 corpus concatenated with the 46,347 incremental V2.15_extrato_14 rows. V2.15 was deduplicated against V2.14 during curation; validate and select checkpoints on all V0 rows.
    artifact: data/processed/dataset_v2.14_plus_v2.15_extrato_14.parquet
    profile: data/processed/dataset_profile_v2.14_plus_v2.15_extrato_14.json
    validation: External-only training rows; use the complete V0 validation dataset.
    reports:
      - docs/v2.15_extrato_14.md

  - id: v2.14-gemini
    name: V2.14 Gemini specialist
    section: Specialist classifier datasets
    description: Deterministically balanced V2.14 subset for labels gemini-3.6-flash,
      gemini-3.7-flash, gemini-3.8-flash; 4,432 rows per label, seed 2026.
    artifact: data/processed/dataset_v2.14-gemini.parquet
    profile: data/processed/dataset_profile_v2.14-gemini.json
    validation: Prompt-grouped 80/20 split for checkpoint selection; full V0 rows for
      these labels are predicted and evaluated after training.
  - id: v2.14-glm
    name: V2.14 GLM specialist
    section: Specialist classifier datasets
    description: Deterministically balanced V2.14 subset for labels glm-5.3, glm-5.3-flash;
      12,292 rows per label, seed 2026.
    artifact: data/processed/dataset_v2.14-glm.parquet
    profile: data/processed/dataset_profile_v2.14-glm.json
    validation: Prompt-grouped 80/20 split for checkpoint selection; full V0 rows for
      these labels are predicted and evaluated after training.

  - id: v0_gemini
    name: V0 GEMINI specialist validation
    section: Validation datasets
    description: All official V0 responses for the gemini-3.6-flash, gemini-3.7-flash,
      gemini-3.8-flash DeBERTa specialist labels; validation-only, never a training corpus.
    artifact: data/processed/dataset_v0_gemini.parquet
    profile: data/processed/dataset_profile_v0_gemini.json
    validation: Official V0 validation subset; 450 rows across 3 specialist labels.
  - id: v0_glm
    name: V0 GLM specialist validation
    section: Validation datasets
    description: All official V0 responses for the glm-5.3, glm-5.3-flash DeBERTa specialist
      labels; validation-only, never a training corpus.
    artifact: data/processed/dataset_v0_glm.parquet
    profile: data/processed/dataset_profile_v0_glm.json
    validation: Official V0 validation subset; 300 rows across 2 specialist labels.

  - id: v0_ext
    name: V0-EXT — frozen external validation
    section: Validation datasets
    description: Deterministic 4,000-response external validation set sampled from Open Pool v16 with all 18 labels, unequal class frequencies, 40–250 word passages, distinct known prompt groups, and broad contributor coverage; frozen with seed 2026.
    artifact: data/processed/dataset_v0_ext.parquet
    profile: data/processed/dataset_profile_v0_ext.json
    validation: Frozen external validation only; use alongside V0 for robustness evaluation and never for training or checkpoint selection.
    external_only: false
    validation_only: true
    reports:
      - docs/v3.0.md
