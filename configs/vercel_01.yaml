dataset_version: vercel_v01
# Budget reservations use pre-promotion list rates or the highest configured
# available route rate where the Gateway lists multiple providers.
reasoning_seed: 2026
reasoning_distribution:
  default: 0.70
  high: 0.30
max_response_characters: 2000
system_prompt: ""
request_timeout_seconds: 120
retry:
  max_attempts: 5
  base_delay_seconds: 1
  max_delay_seconds: 60
  jitter_seconds: 0.5
throttling:
  concurrency: 1
  requests_per_minute: 30
  tokens_per_minute: null
budget:
  max_spend_usd: 300
  enforce: true
backends:
  local:
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
  vercel:
    base_url: https://ai-gateway.vercel.sh/v1
    api_key_env: AI_GATEWAY_API_KEY
