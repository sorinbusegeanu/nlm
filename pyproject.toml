[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "name-that-llm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "scipy>=1.10", "scikit-learn>=1.3", "pyyaml>=6", "joblib>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.2", "transformers>=4.45", "peft>=0.13", "accelerate>=1.0", "safetensors>=0.4"]
dashboard = ["streamlit>=1.38", "plotly>=5.24"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
